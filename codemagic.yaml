workflows:
  ios-workflow:
    name: VitaTrack iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Set this up once in Codemagic's UI: Teams > Integrations > App Store
      # Connect > add your API key, name it "vitatrack_asc". That single
      # integration is what lets both code signing AND the build-number
      # lookup below talk to App Store Connect without any local Mac or
      # manually-managed credentials.
      app_store_connect: vitatrack_asc
    environment:
      vars:
        BUNDLE_ID: "com.vitatrack.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          # Asks App Store Connect what the last-uploaded build number was
          # (across TestFlight + App Store) and bumps one past it — safer
          # than a local counter, since that can drift out of sync if a
          # build is ever triggered from a different machine/branch.
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$BUNDLE_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build and archive
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false # flip to true once you're ready for a real review submission
